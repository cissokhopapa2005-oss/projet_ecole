{% extends "base.html" %}

{% block title %}Supprimer {{ student }}{% endblock %}

{% block content %}
    <article class="card confirm-card">
        <p class="eyebrow">Action définitive</p>
        <h1>Supprimer {{ student }} ?</h1>
        <p>Cette action est définitive : la fiche sera effacée de la base.</p>
        <form method="post" style="margin-top:20px;">
            {% csrf_token %}
            <div class="actions">
                <button type="submit" class="btn-danger">Oui, supprimer</button>
                <a class="button secondary" href="{% url 'students:detail' student.id %}">Annuler</a>
            </div>
        </form>
    </article>
{% endblock %}
